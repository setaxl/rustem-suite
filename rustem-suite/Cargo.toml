[workspace]
resolver = "2"
members = [
    "crates/rustem-core",
    "crates/rustem-auth",
    "crates/rustem-admin",
    "crates/rustem-db",
    "crates/rustem-inventory",
    "crates/rustem-sales",
    "crates/rustem-accounting",
    "crates/rustem-frontend",
    "crates/rustem-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rustem Suite Team"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
http = "1.1"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = "2.0"
tower = "0.5"
tower-http = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
secrecy = "0.8"
thiserror = "1.0"
zeroize = "1.0"
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
rust_decimal = "1.0"
time = "0.3"
rand = "0.8"
rust-embed = "6.5"