[workspace]
resolver = "2"
members = [
    "crates/rustem-core",
    "crates/rustem-db",
    "crates/rustem-auth",
    "crates/rustem-admin",
    "crates/rustem-inventory",
    "crates/rustem-sales",
    "crates/rustem-accounting",
    "crates/rustem-frontend",
    "crates/rustem-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# --- Core / utilitario ---
anyhow = { version = "1", default-features = false }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = { version = "0.3" }
zeroize = "1"
secrecy = { version = "0.8", features = ["serde"] }
sha2 = "0.10"
blake3 = "1"
validator = { version = "0.20", features = ["derive"] }
config = { version = "0.14", default-features = false, features = ["toml", "time"] }
dotenvy = "0.16"

# --- Criptografía / Auth ---
argon2 = { version = "0.5", features = ["std", "zeroize", "rand"] }

# --- Base de datos SurrealDB (SDK oficial, 100% Rust, sin C) ---
surrealdb = "2"

# --- Web / Axum ---
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "ws", "form"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", default-features = false }
async-trait = "0.1"
tower-http = { version = "0.5", default-features = false, features = ["trace", "fs", "set-header"] }
http = "1"
hyper = { version = "1", default-features = false }

# --- Leptos (SSR puro, sin hidratación WASM) ---
leptos = { version = "0.6", default-features = false, features = ["ssr"] }

# --- Assets estáticos embebidos ---
rust-embed = { version = "8", default-features = false }

# --- Testing ---
proptest = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
